name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0; defaults to ref name)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The version and components pinned in rust-toolchain.toml.
      - name: Show active toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked -p victory

      - name: Determine release tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if ($env:INPUT_TAG) {
            $tag = $env:INPUT_TAG
          } elseif ($env:REF_TYPE -eq 'tag') {
            $tag = $env:REF_NAME
          } else {
            $tag = "v0.0.0-$($env:COMMIT_SHA.Substring(0, 7))"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package Windows x64 archive and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $bundleName = "victory-$tag-windows-x64"
          $stageDir = Join-Path "dist" $bundleName
          $zipPath = Join-Path "dist" "$bundleName.zip"
          $sumsPath = Join-Path "dist" "SHA256SUMS.txt"

          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item -LiteralPath "target\release\victory.exe" -Destination $stageDir
          Copy-Item -LiteralPath "Play-VIctory.cmd" -Destination $stageDir
          Copy-Item -LiteralPath "launch.bat" -Destination $stageDir
          Copy-Item -LiteralPath "scripts" -Destination (Join-Path $stageDir "scripts") -Recurse
          Copy-Item -LiteralPath "README.md" -Destination $stageDir
          Copy-Item -LiteralPath "LICENSE" -Destination $stageDir

          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText($sumsPath, "$hash  $bundleName.zip`n", [System.Text.UTF8Encoding]::new($false))

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/victory-${{ env.RELEASE_TAG }}-windows-x64.zip
            dist/SHA256SUMS.txt
